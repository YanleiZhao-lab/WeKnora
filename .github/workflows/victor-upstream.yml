name: victor_wiki upstream sync
on:
  workflow_dispatch:
  push:
    branches: [personal/victor-wiki]
    paths: [".github/workflows/**"]
  schedule:
    - cron: '17 19 * * *'
permissions:
  contents: write
  actions: write
concurrency:
  group: victor-upstream-sync
  cancel-in-progress: false
jobs:
  sync:
    if: github.repository == 'YanleiZhao-lab/WeKnora'
    runs-on: ubuntu-latest
    steps:
      - name: Keep builds on the Lenovo computer
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/${{ github.repository }}/actions/workflows" --paginate --jq '.workflows[] | select(.path != ".github/workflows/victor-upstream.yml" and .state == "active") | .id' |
          while read -r workflow; do
            gh api --method PUT "repos/${{ github.repository }}/actions/workflows/$workflow/disable"
          done
      - name: Sync official main into fork main
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method POST "repos/${{ github.repository }}/merge-upstream" -f branch=main
