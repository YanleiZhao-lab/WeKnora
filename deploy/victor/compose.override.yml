name: victor-wiki
services:
  frontend:
    image: victor-wiki/frontend:${VICTOR_IMAGE_TAG}
    ports: !override
      - "${VICTOR_BIND_ADDRESS:-0.0.0.0}:8090:80"
  app:
    ports: !override
      - "127.0.0.1:8091:8080"
    volumes:
      - ./deploy/victor/builtin_models.yaml:/app/config/builtin_models.yaml:ro
    environment:
      OLLAMA_BASE_URL: http://ollama:11434
      LANGFUSE_ENABLED: "false"
      LOG_PATH: /data/files/logs/app.log
    depends_on:
      ollama:
        condition: service_healthy
  redis:
    volumes:
      - redis-data:/data
  neo4j:
    environment:
      NEO4J_dbms_usage__report_enabled: "false"
    ports: !reset []
  ollama:
    image: ollama/ollama:0.40.18
    container_name: victor-wiki-ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    environment:
      OLLAMA_HOST: 0.0.0.0:11434
      OLLAMA_NO_CLOUD: "true"
      OLLAMA_NUM_PARALLEL: "1"
      OLLAMA_MAX_LOADED_MODELS: "1"
    volumes:
      - ollama-data:/root/.ollama
    restart: unless-stopped
    networks:
      - WeKnora-network
volumes:
  postgres-data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /data1/victor_wiki/postgres
  data-files:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /data1/victor_wiki/files
  docreader-tmp:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /data1/victor_wiki/docreader
  redis-data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /data1/victor_wiki/redis
  ollama-data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /data1/victor_wiki/models
  neo4j-data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /data1/victor_wiki/neo4j
